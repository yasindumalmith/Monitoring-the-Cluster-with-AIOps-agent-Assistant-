apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: aiops-cluster
  region: us-east-1

iam:
  withOIDC: true

managedNodeGroups:
  - name: aiops-nodes
    instanceType: m7i-flex.large

    minSize: 1
    maxSize: 1
    desiredCapacity: 1

    volumeSize: 30
    volumeType: gp3

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
