apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-backend
  namespace: ai-ops
  labels:
    app: ai-ops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-ops-backend
  template:
    metadata:
      labels:
        app: ai-ops-backend
    spec:
      serviceAccountName: ai-ops-assistant
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: yasindumalmith/ai-ops-backend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: DATABASE_URL
            - name: USER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: USER_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: JWT_SECRET
            - name: AGENT_URL
              value: "http://ai-ops-assistant.ai-ops.svc.cluster.local:80"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
