apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-ops-gateway
  namespace: ai-ops
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: ai-ops-alb-config
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-ops-routes
  namespace: ai-ops
spec:
  parentRefs:
    - name: ai-ops-gateway
  rules:
    # 1. Route Backend API endpoints
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: ai-ops-backend
          port: 4000

    # 2. Default Route for Frontend Web Application (/)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ai-ops-frontend
          port: 80
