apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-1
  namespace: oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-1
  template:
    metadata:
      labels:
        app: test-1
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            limits:
              memory: "100Mi" # Hard limit
            requests:
              memory: "50Mi"
