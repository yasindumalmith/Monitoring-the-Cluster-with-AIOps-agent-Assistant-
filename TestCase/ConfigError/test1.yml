apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-1
  namespace: config-error
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-1
  template:
    metadata:
      labels:
        app: test-1
    spec:
      containers:
        - name: test-1
          image: nginx:alpine
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: this-secret-does-not-exist
                  key: password
